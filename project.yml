name: Codenotch
options:
  bundleIdPrefix: com.adeleid
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6WFPL8B9FB
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Vendor/**/README.md"
    dependencies:
      - package: Sparkle
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Codenotch Pro
        CFBundleDisplayName: Codenotch V.1 Pro
        NSHumanReadableCopyright: "© 2026 Adeleid. Original Codenotch © 2026 Vinz. MIT licensed."
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - zh-Hans
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Adeleid fork update feed. Automatic updates remain disabled until
        # Adeleid publishes signed release artifacts and an EdDSA public key.
        SUFeedURL: https://raw.githubusercontent.com/Adeleid/Codenotch---V.1-pro/main/site/appcast.xml
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adeleid.codenotchpro
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Codenotch-Bridging-Header.h

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adeleid.codenotchpro.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
