name: Pro CI

on:
  push:
    branches:
      - pro-branding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and run tests
        run: make test-ci
