name: Pro CI

on:
  push:
    branches:
      - main
      - pro-branding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and run tests
        shell: bash
        run: |
          set -o pipefail
          make test-ci 2>&1 | tee ci-test.log

      - name: Build unsigned preview DMG
        shell: bash
        run: |
          set -o pipefail
          make dmg-ci 2>&1 | tee ci-dmg.log
          mkdir -p dist
          DMG="$(find build/ci -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" "dist/Codenotch-V.1-Pro-preview.dmg"

      - name: Upload Codenotch V.1 Pro DMG
        uses: actions/upload-artifact@v4
        with:
          name: Codenotch-V.1-Pro-preview
          path: dist/Codenotch-V.1-Pro-preview.dmg
          if-no-files-found: error

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ci-test.log
            ci-dmg.log
          if-no-files-found: warn
